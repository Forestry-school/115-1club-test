<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社團志願選填系統</title>
  <style>
    * { box-sizing: border-box; font-family: "Microsoft JhengHei", Arial, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #34495e; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #2980b9; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    /* 驗證視窗 (Modal) */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
    .error-msg { color: #e74c3c; font-size: 14px; margin-top: 8px; display: none; }
    .hidden { display: none; }
    .notice { background: #e8f4f8; padding: 12px; border-left: 4px solid #3498db; margin-bottom: 15px; font-size: 14px; border-radius: 4px; }
    .time-info { font-size: 13px; color: #7f8c8d; text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🎓 社團志願選填系統</h2>
  <div id="timeNotice" class="time-info"></div>

  <div id="loading">資料載入中，請稍後...</div>

  <div id="mainForm" class="hidden">
    <!-- 步驟一：選擇班級與姓名 -->
    <div id="step1">
      <div class="form-group">
        <label for="selectClass">請選擇班級：</label>
        <select id="selectClass" onchange="onClassChange()">
          <option value="">-- 請選擇班級 --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="selectStudent">點擊學生姓名驗證身份：</label>
        <select id="selectStudent" disabled onchange="onStudentSelect()">
          <option value="">-- 請先選擇班級 --</option>
        </select>
      </div>
    </div>

    <!-- 步驟二：志願選填 -->
    <div id="step2" class="hidden">
      <div class="notice">
        <strong id="studentInfoText"></strong><br>
        <span id="fixedClubNotice" style="color: #e67e22; font-weight: bold;"></span>
      </div>

      <form id="clubForm">
        <div id="preferenceArea">
          <div class="form-group">
            <label for="choice1">第一志願：</label>
            <select id="choice1" class="club-select"></select>
          </div>
          <div class="form-group">
            <label for="choice2">第二志願：</label>
            <select id="choice2" class="club-select"></select>
          </div>
          <div class="form-group">
            <label for="choice3">第三志願：</label>
            <select id="choice3" class="club-select"></select>
          </div>
        </div>

        <button type="button" id="btnSubmit" onclick="submitChoices()">確認送出選填</button>
        <button type="button" onclick="resetToStep1()" style="background-color: #95a5a6; margin-top: 8px;">重新選擇學生</button>
      </form>
    </div>
  </div>
</div>

<!-- 身分驗證 Modal -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <h3>身分驗證</h3>
    <p>請輸入 <strong id="targetStudentName" style="color:#2980b9;"></strong> 的西元生日<br>
       <small style="color:#7f8c8d;">( 例如：2008年9月4日 請輸入 20080904 )</small>
    </p>
    <input type="password" id="inputBirthday" placeholder="請輸入生日" onkeydown="if(event.key==='Enter') verifyBirthday()">
    <div id="authErrorMsg" class="error-msg">驗證失敗！請確認生日是否正確。</div>
    <button onclick="verifyBirthday()" style="margin-top:15px;">確定</button>
    <button onclick="cancelAuthModal()" style="background-color:#95a5a6; margin-top:8px;">取消</button>
  </div>
</div>

<script>
  let dbData = {};
  let currentStudent = null;

  // 頁面載入時透過原生 API 讀取 GAS 後端
  window.onload = function() {
    google.script.run
      .withSuccessHandler(initSystem)
      .withFailureHandler(function(err) {
        alert("資料讀取失敗，請重新整理網頁：" + err);
      })
      .getInitialData();
  };

  function initSystem(data) {
    dbData = data;
    
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('mainForm').classList.remove('hidden');

    if (dbData.startTime || dbData.endTime) {
      document.getElementById('timeNotice').innerText = 
        `開放時間：${dbData.startTime || '無限制'} ~ ${dbData.endTime || '無限制'}`;
    }

    const classes = [...new Set(dbData.students.map(s => s.className))];
    const classSelect = document.getElementById('selectClass');
    classes.forEach(c => {
      let opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      classSelect.appendChild(opt);
    });
  }

  function onClassChange() {
    const selectedClass = document.getElementById('selectClass').value;
    const studentSelect = document.getElementById('selectStudent');
    studentSelect.innerHTML = '<option value="">-- 請選擇學生姓名 --</option>';

    if (!selectedClass) {
      studentSelect.disabled = true;
      return;
    }

    const filteredStudents = dbData.students.filter(s => s.className === selectedClass);
    filteredStudents.forEach(s => {
      let opt = document.createElement('option');
      opt.value = s.seatNumber;
      opt.textContent = `${s.seatNumber}號 ${s.name}`;
      studentSelect.appendChild(opt);
    });

    studentSelect.disabled = false;
  }

  // 點選名字觸發彈窗
  function onStudentSelect() {
    const selectedClass = document.getElementById('selectClass').value;
    const selectedSeat = document.getElementById('selectStudent').value;
    
    if (!selectedSeat) return;

    currentStudent = dbData.students.find(s => s.className === selectedClass && s.seatNumber === selectedSeat);
    
    if (currentStudent) {
      document.getElementById('targetStudentName').innerText = `${currentStudent.className} ${currentStudent.name}`;
      document.getElementById('inputBirthday').value = '';
      document.getElementById('authErrorMsg').style.display = 'none';
      document.getElementById('authModal').style.display = 'flex';
    }
  }

  function cancelAuthModal() {
    document.getElementById('authModal').style.display = 'none';
    document.getElementById('selectStudent').value = "";
    currentStudent = null;
  }

  function verifyBirthday() {
    const inputVal = document.getElementById('inputBirthday').value.replace(/\D/g, '').trim();
    
    let rawBirthday = currentStudent.birthday || "";
    const correctBirthday = String(rawBirthday).replace(/\D/g, '').trim();
    const seatNum = String(currentStudent.seatNumber).trim();

    // 驗證邏輯：生日吻合 OR 座號吻合 OR 萬用碼 1234
    if ((correctBirthday && inputVal === correctBirthday) || inputVal === seatNum || inputVal === "1234") {
      document.getElementById('authModal').style.display = 'none';
      enterClubStep();
    } else {
      document.getElementById('authErrorMsg').style.display = 'block';
    }
  }

  function enterClubStep() {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');

    document.getElementById('studentInfoText').innerText = 
      `學生：${currentStudent.className} ${currentStudent.seatNumber}號 ${currentStudent.name} (${currentStudent.level})`;

    const prefArea = document.getElementById('preferenceArea');

    if (currentStudent.fixedClub) {
      document.getElementById('fixedClubNotice').innerText = 
        `※ 您已被指定加入【${currentStudent.fixedClub}】，無需選填志願，點擊下方確認送出即可。`;
      prefArea.classList.add('hidden');
    } else {
      document.getElementById('fixedClubNotice').innerText = "";
      prefArea.classList.remove('hidden');
      renderClubOptions();
      loadPreviousChoices();
    }
  }

  function renderClubOptions() {
    const selects = [document.getElementById('choice1'), document.getElementById('choice2'), document.getElementById('choice3')];
    
    const availableClubs = dbData.clubs.filter(c => {
      if (!c.gradeLimit || c.gradeLimit === "全體" || c.gradeLimit === "無限制") return true;
      return c.gradeLimit.includes(currentStudent.level);
    });

    selects.forEach((sel, index) => {
      sel.innerHTML = `<option value="">-- 請選擇第 ${index + 1} 志願 --</option>`;
      availableClubs.forEach(c => {
        let opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name + (c.teacher ? ` (${c.teacher}老師)` : '');
        sel.appendChild(opt);
      });
    });
  }

  function loadPreviousChoices() {
    const studentKey = `${currentStudent.className}_${currentStudent.seatNumber}`;
    const userRecord = dbData.existingRecords ? dbData.existingRecords[studentKey] : null;

    if (userRecord) {
      for (const [clubName, rank] of Object.entries(userRecord)) {
        if (rank == 1) document.getElementById('choice1').value = clubName;
        if (rank == 2) document.getElementById('choice2').value = clubName;
        if (rank == 3) document.getElementById('choice3').value = clubName;
      }
    }
  }

  function resetToStep1() {
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('selectStudent').value = "";
    currentStudent = null;
  }

  function submitChoices() {
    let preferences = [];

    if (!currentStudent.fixedClub) {
      const c1 = document.getElementById('choice1').value;
      const c2 = document.getElementById('choice2').value;
      const c3 = document.getElementById('choice3').value;

      if (!c1 || !c2 || !c3) {
        alert("請完整選擇第 1、2、3 志願！");
        return;
      }

      if (c1 === c2 || c2 === c3 || c1 === c3) {
        alert("志願選項不能重複！");
        return;
      }

      preferences = [
        { clubName: c1, rank: 1 },
        { clubName: c2, rank: 2 },
        { clubName: c3, rank: 3 }
      ];
    }

    const payload = {
      className: currentStudent.className,
      seatNumber: currentStudent.seatNumber,
      studentName: currentStudent.name,
      level: currentStudent.level,
      fixedClub: currentStudent.fixedClub || "",
      preferences: preferences
    };

    document.getElementById('loading').innerText = "資料儲存中...";
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('btnSubmit').disabled = true;

    // 將資料送回 Code.gs 寫入試算表
    google.script.run
      .withSuccessHandler(function(res) {
        document.getElementById('loading').classList.add('hidden');
        if (res.status === "success") {
          alert("選填資料已成功送出儲存！");
          location.reload();
        } else {
          alert("儲存失敗：" + (res.message || "未知錯誤"));
          document.getElementById('btnSubmit').disabled = false;
        }
      })
      .withFailureHandler(function(err) {
        document.getElementById('loading').classList.add('hidden');
        alert("連線失敗：" + err);
        document.getElementById('btnSubmit').disabled = false;
      })
      .submitStudentPreferences(payload);
  }
</script>

</body>
</html>
