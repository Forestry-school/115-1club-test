<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生社團選填系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- 驗證彈窗容器 -->
    <div id="birthdayModal" class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md text-center">
        <div class="text-4xl mb-2">🔒</div>
        <h2 class="text-2xl font-bold text-gray-800 mb-1">身分驗證</h2>
        <p id="studentInfoDisplay" class="text-green-800 font-bold mb-4">101班 02號 黃子杰</p>

        <p class="text-sm text-gray-500 mb-4">請輸入學生密碼以進行驗證：</p>

        <!-- 密碼輸入框 -->
        <input 
            type="password" 
            id="inputBirthday" 
            placeholder="請輸入密碼" 
            class="w-full text-center border-2 border-gray-300 focus:border-green-600 rounded-lg py-3 px-4 text-lg outline-none transition mb-3"
            onkeypress="if(event.key==='Enter') verifyBirthday();"
        >

        <!-- 錯誤提示訊息 -->
        <p id="birthdayError" class="text-red-500 text-sm font-semibold mb-4 hidden">
            ⚠️ 密碼不正確，請重新輸入！
        </p>

        <!-- 按鈕組 -->
        <div class="flex gap-3">
            <button onclick="closeBirthdayModal()" class="w-1/2 py-3 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300 transition">
                取消
            </button>
            <button onclick="verifyBirthday()" class="w-1/2 py-3 bg-emerald-800 text-white rounded-lg font-bold hover:bg-emerald-900 transition">
                確認驗證
            </button>
        </div>
    </div>

    <script>
        // 全域變數定義
        let pendingStudent = null;
        let verifiedBirthday = "";

        // 模擬後端載入該學生資料 (實際執行時會由 doGet 填入)
        // pendingStudent = { className: "101", seatNumber: "02", name: "黃子杰", birthday: "20190904" };

        // 關鍵：純密碼驗證邏輯
        function verifyBirthday() {
            const inputInput = document.getElementById('inputBirthday');
            const errorEl = document.getElementById('birthdayError');

            // 1. 取出輸入框文字並去除前後空白
            const inputPwd = String(inputInput ? inputInput.value : "").trim();

            if (!pendingStudent) {
                alert("尚未選擇學生或學生資料載入中！");
                return;
            }

            // 2. 取出試算表設定的密碼並去除前後空白
            const targetPwd = String(pendingStudent.birthday || "").trim();

            // 3. 純字串比對 (只要輸入字串跟試算表一模一樣就放行)
            if (inputPwd !== "" && inputPwd === targetPwd) {
                verifiedBirthday = inputPwd;
                const selectedStudent = pendingStudent;

                if (errorEl) errorEl.classList.add('hidden');
                closeBirthdayModal();
                proceedToStudentClub(selectedStudent);
            } else {
                // 比對失敗，顯示提示字樣
                if (errorEl) errorEl.classList.remove('hidden');
            }
        }

        function closeBirthdayModal() {
            document.getElementById('inputBirthday').value = "";
            document.getElementById('birthdayError').classList.add('hidden');
        }

        function proceedToStudentClub(student) {
            alert("驗證成功！進入社團選填頁面。");
            // 這裡銜接進入選社主畫面的 function
        }
    </script>
</body>
</html>
